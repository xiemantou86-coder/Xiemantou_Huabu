                                                        <div class="resolution-custom-title">自动尺寸</div>
                                                        <div class="resolution-custom-hint">默认 1024x1024；提示词包含比例或明确尺寸时自动匹配。</div>
                                                    </div>
                                                </div>
                                                <div id="resolutionPresetPane" class="resolution-picker-pane preset hidden">
                                                    <div id="resolutionRatioList" class="resolution-picker-list">

                                                        <button id="chat-ratio-portrait" type="button" class="resolution-picker-option" onclick="selectBuiltInRatio('portrait')"><span>2:3</span><small>竖图</small></button>

                                                        <button id="chat-ratio-landscape43" type="button" class="resolution-picker-option" onclick="selectBuiltInRatio('landscape43')"><span>4:3</span><small>横图</small></button>
                                                        <button id="chat-ratio-story" type="button" class="resolution-picker-option" onclick="selectBuiltInRatio('story')"><span>9:16</span><small>竖屏</small></button>
                                                        <button id="chat-ratio-wide" type="button" class="resolution-picker-option" onclick="selectBuiltInRatio('wide')"><span>16:9</span><small>宽屏</small></button>

                                                        <button type="button" class="resolution-picker-option" data-resolution="1k" onclick="selectResolutionPreset('1k')"><span>1K</span><small id="resolutionPreset1k">1024x1024</small></button>
                                                        <button type="button" class="resolution-picker-option" data-resolution="2k" onclick="selectResolutionPreset('2k')"><span>2K</span><small id="resolutionPreset2k">1536x1536</small></button>
                                                        <button type="button" class="resolution-picker-option" data-resolution="4k" onclick="selectResolutionPreset('4k')"><span>4K</span><small id="resolutionPreset4k">2048x2048</small></button>
                                                    </div>
                                                </div>
                                                <div id="resolutionCustomPane" class="resolution-picker-pane custom hidden">
                                                    <div class="resolution-custom-box">
                                                        <div class="resolution-custom-title">自定义分辨率</div>
                                                        <div class="resolution-custom-row">
                                                            <input id="customResolutionWidth" type="number" min="256" max="8192" step="1" placeholder="宽">
                                                            <span>x</span>
                                                            <input id="customResolutionHeight" type="number" min="256" max="8192" step="1" placeholder="高">
                                                            <button type="button" onclick="applyCustomResolution()">应用</button>
                                                        </div>
                                                        <div id="customResolutionHint" class="resolution-custom-hint">输入 256-8192 之间的宽度和高度</div>

                                    </div>
                                </div>

                            <button id="stopBtn" onclick="stopGeneration()" class="stop-btn" title="停止生成"><i data-lucide="square"></i></button>
                            <button id="sendBtn" onclick="sendMessage()" class="send-btn" title="发送" data-i18n-title="chat.send"><i data-lucide="send"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <div id="imagePreviewModal" class="image-preview-modal" onclick="closeImagePreview()">
        <button class="image-preview-close" title="关闭" aria-label="关闭" onclick="event.stopPropagation();closeImagePreview()"><i data-lucide="x"></i></button>
        <img id="imagePreviewImg" src="" alt="preview" onclick="event.stopPropagation()">
    </div>

    <script>
        lucide.createIcons();
        function tr(key){ return window.StudioI18n ? StudioI18n.t(key) : key; }
        function defaultTitle(){ return tr('chat.newConversation'); }
        function setChatTitle(title){
            document.getElementById('chatTitle').textContent = title || defaultTitle();
        }
        function applyLanguage(lang){
            if(lang && window.StudioI18n) StudioI18n.set(lang);
            document.title = tr('chat.title');
            if(!currentConversation?.title || currentConversation.title === '新对话' || currentConversation.title === 'New Chat') setChatTitle('');
            renderThreads();
        }
        window.addEventListener('message', event => {
            if(event.data?.type === 'studio-lang') applyLanguage(event.data.lang);
        });
        window.addEventListener('studio-lang-change', () => {
            document.title = tr('chat.title');
            if(!currentConversation?.title || currentConversation.title === '新对话' || currentConversation.title === 'New Chat') setChatTitle('');
            renderThreads();
        });
        window.addEventListener('resize', () => {
            if(document.getElementById('modelPicker')?.classList.contains('open')) positionModelPicker();
            if(document.getElementById('resolutionPicker')?.classList.contains('open')) positionResolutionPicker();
        });
        function uuid(){
            if(crypto?.randomUUID) return crypto.randomUUID();
            return 'u-' + Math.random().toString(16).slice(2) + Date.now();
        }

        const USER_KEY = 'gpt_chat_browser_user';
        const CHAT_SETTINGS_KEY = 'gpt_chat_settings_v1';
        const CHAT_LAST_CONVERSATION_KEY = 'gpt_chat_last_conversation_v1';
        const CHAT_ATTACHMENT_MAX = 20;
        const CHAT_SIZE_MODE_VERSION = 2;
        const userId = localStorage.getItem(USER_KEY) || uuid();
        localStorage.setItem(USER_KEY, userId);

        function readChatSettings(){
            try {
                const raw = localStorage.getItem(CHAT_SETTINGS_KEY);
                const parsed = raw ? JSON.parse(raw) : {};
                return parsed && typeof parsed === 'object' ? parsed : {};
            } catch(e) {
                return {};
            }
        }

        function isObject(value){
            return value && typeof value === 'object' && !Array.isArray(value);
        }

        const savedChatSettings = readChatSettings();
        let conversations = [];
        let currentConversation = null;
        let mode = 'agent';
        let provider = savedChatSettings.provider || 'comfly';
        let msModel = savedChatSettings.msModel || '';
        let activeChatModel = savedChatSettings.activeChatModel || '';
        let activeImageProvider = savedChatSettings.activeImageProvider || 'comfly';
        let activeImageModel = savedChatSettings.activeImageModel || '';
        let systemPrompt = String(savedChatSettings.systemPrompt || '').trim();
        let apiProviders = [];
        let chatProviderModels = isObject(savedChatSettings.chatProviderModels) ? savedChatSettings.chatProviderModels : {};
        let chatRatio = ['square','portrait','portrait43','landscape43','landscape','story','wide'].includes(savedChatSettings.chatRatio) ? savedChatSettings.chatRatio : 'square';
        let chatResolution = savedChatSettings.chatSizeModeVersion === CHAT_SIZE_MODE_VERSION && ['auto','1k','2k','4k','custom'].includes(savedChatSettings.chatResolution) ? savedChatSettings.chatResolution : 'auto';
        let chatPresetResolution = ['1k','2k','4k'].includes(savedChatSettings.chatPresetResolution) ? savedChatSettings.chatPresetResolution : (chatResolution === 'custom' ? '1k' : chatResolution);
        let chatCustomSize = normalizeChatCustomSize(savedChatSettings.chatCustomSize || '') || '1024x1024';
        let modelPickerScope = savedChatSettings.modelPickerScope === 'image' ? 'image' : 'chat';
        let modelPickerHome = null;
        let resolutionPickerHome = null;
        let refs = [];
        let config = { chat_model: 'gpt-5.5', image_model: 'gpt-image-2', ms_chat_models: [] };

        const SIZE_OPTIONS = {
            square: [['1024x1024','1k'], ['1536x1536','2k'], ['2048x2048','4k']],
            portrait: [['720x1080','1k'], ['1024x1536','2k'], ['1365x2048','4k']],
            portrait43: [['1008x1344','1k'], ['1536x2048','2k'], ['2448x3264','4k']],
            landscape43: [['1344x1008','1k'], ['2048x1536','2k'], ['3264x2448','4k']],
            landscape: [['1080x720','1k'], ['1536x1024','2k'], ['2048x1365','4k']],
            story: [['720x1280','1k'], ['1080x1920','2k'], ['1440x2560','4k']],
            wide: [['1280x720','1k'], ['1920x1080','2k'], ['2560x1440','4k']]
        };
        const CHAT_RATIO_VALUES = {
            square:'1:1',
            portrait:'2:3',
            landscape:'3:2',
            portrait43:'3:4',
            landscape43:'4:3',
            story:'9:16',
            wide:'16:9'
        };

        const headers = () => ({'Content-Type':'application/json', 'X-User-ID':userId});

        function rememberConversation(id){
            try {
                if(id) localStorage.setItem(CHAT_LAST_CONVERSATION_KEY, id);
                else localStorage.removeItem(CHAT_LAST_CONVERSATION_KEY);
            } catch(e) {}
        }

        function rememberedConversation(){
            try { return localStorage.getItem(CHAT_LAST_CONVERSATION_KEY) || ''; }
            catch(e) { return ''; }
        }

        function saveChatSettings(){
            try {
                localStorage.setItem(CHAT_SETTINGS_KEY, JSON.stringify({
                    mode,
                    provider,
                    msModel,
                    activeChatModel,
                    activeImageProvider,
                    activeImageModel,
                    systemPrompt,
                    chatProviderModels,
                    chatRatio,
                    chatResolution,
                    chatPresetResolution,
                    chatCustomSize,
                    modelPickerScope,
                    chatSizeModeVersion: CHAT_SIZE_MODE_VERSION
                }));
            } catch(e) {}
        }

        function syncSystemPromptUI(){
            const input = document.getElementById('systemPromptInput');
            if(input) input.value = systemPrompt || '';
        }

        function toggleSystemPrompt(force){
            const pop = document.getElementById('systemPromptPopover');
            if(!pop) return;
            const shouldOpen = typeof force === 'boolean' ? force : !pop.classList.contains('open');
            pop.classList.toggle('open', shouldOpen);
            if(shouldOpen){
                toggleHistory(false);
                syncSystemPromptUI();
                lucide.createIcons();
            }
        }

        function saveSystemPromptFromUI(){
            const input = document.getElementById('systemPromptInput');
            systemPrompt = String(input?.value || '').trim();
            saveChatSettings();
            toggleSystemPrompt(false);
        }

        function clearSystemPrompt(){
            systemPrompt = '';
            const input = document.getElementById('systemPromptInput');
            if(input) input.value = '';
            saveChatSettings();
        }

        function currentSystemPrompt(){
            const pop = document.getElementById('systemPromptPopover');
            const input = document.getElementById('systemPromptInput');
            const value = pop?.classList.contains('open') && input ? input.value : systemPrompt;
            return String(value || '').trim();
        }

        function uniqueModels(list){
            const seen = new Set();
            return (list || []).map(item => String(item || '').trim()).filter(item => item && !seen.has(item) && seen.add(item));
        }
        function chatProviders(){
            const list = (apiProviders || []).filter(p => p.enabled !== false && (p.chat_models || []).length);
            if(config.ms_chat_models?.length && !list.some(p => p.id === 'modelscope')) list.push({id:'modelscope', name:'ModelScope', chat_models:config.ms_chat_models, image_models:[]});
            return list.length ? list : [{id:'comfly', name:'API', chat_models:[config.chat_model || 'gpt-4o-mini'], image_models:[config.image_model || 'gpt-image-2']}];
        }
        function imageProviders(){
            const list = (apiProviders || []).filter(p => p.enabled !== false && (p.image_models || []).length);
            return list.length ? list : [{id:'comfly', name:'API', image_models:[config.image_model || 'gpt-image-2'], chat_models:[config.chat_model || 'gpt-4o-mini']}];
        }
        function providerById(id, kind='chat'){
            const list = kind === 'image' ? imageProviders() : chatProviders();
            return list.find(p => p.id === id) || list[0];
        }
        function activePickerKind(){
            return mode === 'image' ? 'image' : (mode === 'agent' ? modelPickerScope : 'chat');
        }
        function currentProviderId(kind=activePickerKind()){
            return kind === 'image' ? activeImageProvider : provider;
        }
        function modelListForCurrent(kind=activePickerKind()){
            const item = providerById(currentProviderId(kind), kind);
            return uniqueModels(kind === 'image' ? item.image_models : item.chat_models);
        }
        function currentModel(kind=activePickerKind()){
            return kind === 'image' ? activeImageModel : (provider === 'modelscope' ? (msModel || activeChatModel) : activeChatModel);
        }
        function providerNameById(id, kind=activePickerKind()){
            const item = providerById(id, kind);
            return item?.name || item?.id || 'API';
        }
        function shortModelName(value){
            return String(value || '').split('/').pop().split(':')[0] || 'Model';
        }
        function renderProviderControls(){
            const kind = activePickerKind();
            const providers = kind === 'image' ? imageProviders() : chatProviders();
            const pid = currentProviderId(kind);
            if(!providers.some(p => p.id === pid)) {
                if(kind === 'image') activeImageProvider = providers[0]?.id || 'comfly';
                else provider = providers[0]?.id || 'comfly';
            }
            const models = modelListForCurrent(kind);
            if(kind === 'image' && !models.includes(activeImageModel)) activeImageModel = models[0] || config.image_model;
            if(kind !== 'image' && !models.includes(activeChatModel)) activeChatModel = chatProviderModels[provider] && models.includes(chatProviderModels[provider]) ? chatProviderModels[provider] : (models[0] || config.chat_model);
            if(kind !== 'image' && provider === 'modelscope') msModel = activeChatModel;
            renderModelPicker();
        }

        function validateSavedProviderState(){
            const chatProviderList = chatProviders();
            provider = chatProviderList.some(p => p.id === provider) ? provider : (chatProviderList[0]?.id || 'comfly');
            const chatModels = uniqueModels(providerById(provider, 'chat')?.chat_models || []);
            const rememberedChatModel = chatProviderModels[provider];
            activeChatModel = chatModels.includes(activeChatModel)
                ? activeChatModel
                : (chatModels.includes(rememberedChatModel) ? rememberedChatModel : (chatModels[0] || config.chat_model));
            chatProviderModels[provider] = activeChatModel;
            if(provider === 'modelscope') msModel = activeChatModel;
            if(config.ms_chat_models?.length && msModel && !config.ms_chat_models.includes(msModel)) msModel = config.ms_chat_models[0];
            if(config.ms_chat_models?.length && provider === 'modelscope') activeChatModel = msModel || config.ms_chat_models[0];

            const imageProviderList = imageProviders();
            activeImageProvider = imageProviderList.some(p => p.id === activeImageProvider) ? activeImageProvider : (imageProviderList[0]?.id || 'comfly');
            const imageModels = uniqueModels(providerById(activeImageProvider, 'image')?.image_models || []);
            activeImageModel = imageModels.includes(activeImageModel) ? activeImageModel : (imageModels[0] || config.image_model);
            if(mode !== 'agent' && mode !== 'chat' && mode !== 'image') mode = 'chat';
            if(mode === 'chat') modelPickerScope = 'chat';
            if(mode === 'image') modelPickerScope = 'image';
        }

        async function loadConfig(){
            try {
                const data = await fetch('/api/config').then(r=>r.json());
                config = { ...config, ...data };
                apiProviders = Array.isArray(config.api_providers) ? config.api_providers : [];
                config.chat_model = (config.chat_models || []).find(m => m === 'gpt-5.5') || config.chat_model || 'gpt-5.5';
                config.image_model = config.image_model || ((config.image_models || [])[0]) || 'gpt-image-2';
                validateSavedProviderState();
                setMode(mode, false);
                updateModelLabel();
                saveChatSettings();
            } catch(e) {}
        }
        try {
            const apiChannel = new BroadcastChannel('studio-api');
            apiChannel.onmessage = async (e) => {
                if(e.data?.type === 'providers-changed'){
                    await loadConfig();
                    renderProviderControls();
                    updateModelLabel();
                }
            };
        } catch(e) {}

        function setProvider(p, kind=activePickerKind()) {
            if(kind === 'image') activeImageProvider = p;
            else provider = p;
            const models = modelListForCurrent(kind);
            if(kind === 'image') activeImageModel = models[0] || activeImageModel;
            else {
                activeChatModel = chatProviderModels[provider] && models.includes(chatProviderModels[provider]) ? chatProviderModels[provider] : (models[0] || activeChatModel);
                if(provider === 'modelscope') msModel = activeChatModel;
            }
            renderProviderControls();
            updateModelLabel();
            saveChatSettings();
        }
        function setActiveModel(model, kind=activePickerKind()){
            if(kind === 'image') activeImageModel = model;
            else {
                activeChatModel = model;
                chatProviderModels[provider] = model;
                if(provider === 'modelscope') msModel = model;
            }
            renderProviderControls();
            updateModelLabel();
            saveChatSettings();
        }

        function toggleModelPicker(force){
            const picker = document.getElementById('modelPicker');
            const pop = document.getElementById('modelPickerPopover');
            const shouldOpen = typeof force === 'boolean' ? force : !picker.classList.contains('open');
            picker.classList.toggle('open', shouldOpen);
            pop?.classList.toggle('open', shouldOpen);
            if(shouldOpen) {
                toggleResolutionPicker(false);
                if(pop && pop.parentElement !== document.body) {
                    modelPickerHome = picker;
                    document.body.appendChild(pop);
                }
                if(mode === 'image') modelPickerScope = 'image';
                if(mode === 'chat') modelPickerScope = 'chat';
                renderModelPicker();
                positionModelPicker();
                lucide.createIcons();
            } else if(pop && modelPickerHome && pop.parentElement === document.body) {
                modelPickerHome.appendChild(pop);
            }
        }

        function positionModelPicker(){
            const btn = document.getElementById('modelPickerBtn');
            const pop = document.getElementById('modelPickerPopover');
            if(!btn || !pop) return;
            const rect = btn.getBoundingClientRect();
            const viewportW = (window.visualViewport?.width || window.innerWidth);
            const viewportH = (window.visualViewport?.height || window.innerHeight);
            const width = Math.min(380, Math.max(300, viewportW - 32));
            const estimatedHeight = Math.min(390, Math.max(260, viewportH * .62));
            const availableAbove = Math.max(180, rect.top - 14);
            const maxHeight = Math.min(390, availableAbove, viewportH - 32);
            const left = Math.min(Math.max(16, rect.left), Math.max(16, viewportW - width - 16));
            const top = Math.max(12, rect.top - maxHeight - 10);
            pop.style.setProperty('--model-picker-left', `${Math.round(left)}px`);
            pop.style.setProperty('--model-picker-top', `${Math.round(Math.max(16, top))}px`);
            pop.style.setProperty('--model-picker-width', `${Math.round(width)}px`);
            pop.style.setProperty('--model-picker-max-height', `${Math.round(maxHeight)}px`);
            requestAnimationFrame(() => {
                const box = pop.getBoundingClientRect();
                const nextLeft = box.right > viewportW - 12 ? (left - (box.right - viewportW + 12)) : left;
                const overlap = box.bottom - (rect.top - 8);
                const nextTop = overlap > 0 ? (top - overlap - 2) : top;
                pop.style.setProperty('--model-picker-left', `${Math.round(Math.max(12, nextLeft))}px`);
                pop.style.setProperty('--model-picker-top', `${Math.round(Math.max(12, nextTop))}px`);
            });
        }
        function toggleResolutionPicker(force){
            const picker = document.getElementById('resolutionPicker');
            const pop = document.getElementById('resolutionPickerPopover');
            if(!picker) return;
            const shouldOpen = typeof force === 'boolean' ? force : !picker.classList.contains('open');
            picker.classList.toggle('open', shouldOpen);
            pop?.classList.toggle('open', shouldOpen);
            if(shouldOpen){
                toggleModelPicker(false);
                if(pop && pop.parentElement !== document.body){
                    resolutionPickerHome = picker;
                    document.body.appendChild(pop);
                }
                updateChatResolutionUI();
                positionResolutionPicker();
                lucide.createIcons();
            } else if(pop && resolutionPickerHome && pop.parentElement === document.body){
                resolutionPickerHome.appendChild(pop);
            }
        }

        function positionResolutionPicker(){
            const btn = document.getElementById('resolutionPickerBtn');
            const pop = document.getElementById('resolutionPickerPopover');
            if(!btn || !pop) return;
            const rect = btn.getBoundingClientRect();
            const viewportW = (window.visualViewport?.width || window.innerWidth);
            const viewportH = (window.visualViewport?.height || window.innerHeight);
            const desiredWidth = chatResolution === 'auto' ? 300 : (chatResolution === 'custom' ? 340 : 420);
            const width = Math.min(desiredWidth, Math.max(260, viewportW - 32));
            const safeX = 12;
            const safeTop = 12;
            const safeBottom = 18;
            const gap = 10;
            const left = Math.min(Math.max(safeX, rect.left + rect.width / 2 - width / 2), Math.max(safeX, viewportW - width - safeX));
            const availableAbove = Math.max(96, rect.top - safeTop - gap);
            const initialHeight = Math.min(chatResolution === 'auto' ? 220 : 390, availableAbove, viewportH - safeTop - safeBottom);
            const initialTop = Math.max(safeTop, rect.top - initialHeight - gap);
            pop.style.setProperty('--resolution-picker-left', `${Math.round(left)}px`);
            pop.style.setProperty('--resolution-picker-top', `${Math.round(initialTop)}px`);
            pop.style.setProperty('--resolution-picker-width', `${Math.round(width)}px`);
            pop.style.setProperty('--resolution-picker-max-height', `${Math.round(initialHeight)}px`);
            pop.style.setProperty('--resolution-picker-list-height', '320px');
            requestAnimationFrame(() => {
                const naturalHeight = Math.ceil(pop.scrollHeight || pop.getBoundingClientRect().height || 160);
                const maxHeight = Math.max(96, Math.min(naturalHeight, availableAbove, viewportH - safeTop - safeBottom));
                const headHeight = Math.ceil(pop.querySelector('.resolution-picker-head')?.getBoundingClientRect().height || 50);
                const listHeight = Math.max(58, maxHeight - headHeight - 20);
                const top = Math.max(safeTop, rect.top - maxHeight - gap);
                pop.style.setProperty('--resolution-picker-max-height', `${Math.round(maxHeight)}px`);
                pop.style.setProperty('--resolution-picker-list-height', `${Math.round(listHeight)}px`);
                pop.style.setProperty('--resolution-picker-top', `${Math.round(top)}px`);
                const box = pop.getBoundingClientRect();
                const nextLeft = box.right > viewportW - 12 ? (left - (box.right - viewportW + 12)) : left;
                const overlap = box.bottom - (rect.top - 8);
                const nextTop = overlap > 0 ? (top - overlap - 2) : top;
                pop.style.setProperty('--resolution-picker-left', `${Math.round(Math.max(12, nextLeft))}px`);
                pop.style.setProperty('--resolution-picker-top', `${Math.round(Math.max(12, nextTop))}px`);
            });
        }

        function setModelPickerScope(kind){
            modelPickerScope = kind === 'image' ? 'image' : 'chat';
            renderProviderControls();
            updateModelLabel();
            saveChatSettings();
        }

        function renderModelPicker(){
            const kind = activePickerKind();
            const picker = document.getElementById('modelPicker');
            const scope = document.getElementById('modelPickerScope');
            const providerList = document.getElementById('modelProviderList');
            const modelList = document.getElementById('modelList');
            const providerLabel = document.getElementById('modelPickerProvider');
            const modelLabel = document.getElementById('modelPickerModel');
            const title = document.getElementById('modelPickerTitle');
            if(!picker || !scope || !providerList || !modelList) return;
            const currentPid = currentProviderId(kind);
            const currentMdl = currentModel(kind);
            providerLabel.textContent = providerNameById(currentPid, kind);
            if(mode === 'agent') {
                modelLabel.textContent = `${shortModelName(activeChatModel)} + ${shortModelName(activeImageModel)}`;
            } else {
                modelLabel.textContent = shortModelName(currentMdl);
            }
            title.textContent = mode === 'agent' ? 'Agent 模型' : (kind === 'image' ? '生图模型' : '对话模型');
            scope.innerHTML = mode === 'agent'
                ? `<button class="${kind === 'chat' ? 'active' : ''}" onclick="setModelPickerScope('chat')">对话</button><button class="${kind === 'image' ? 'active' : ''}" onclick="setModelPickerScope('image')">图像</button>`
                : '';
            scope.style.display = mode === 'agent' ? 'flex' : 'none';
            const providers = kind === 'image' ? imageProviders() : chatProviders();
            providerList.innerHTML = providers.length
                ? providers.map(p => `<button class="model-picker-option ${p.id === currentPid ? 'active' : ''}" onclick="setProvider('${escapeHtml(p.id)}','${kind}')"><span>${escapeHtml(p.name || p.id)}</span>${p.id === currentPid ? '<i data-lucide="check"></i>' : ''}</button>`).join('')
                : `<div class="model-picker-empty">暂无平台</div>`;
            const models = modelListForCurrent(kind);
            modelList.innerHTML = models.length
                ? models.map(m => `<button class="model-picker-option ${m === currentMdl ? 'active' : ''}" onclick="setActiveModel('${escapeHtml(m)}','${kind}');toggleModelPicker(false)"><span>${escapeHtml(shortModelName(m))}</span>${m === currentMdl ? '<i data-lucide="check"></i>' : ''}</button>`).join('')
                : `<div class="model-picker-empty">暂无模型</div>`;
            lucide.createIcons();
        }

        // ===== 对话加载骨架屏 =====
        let _skeletonTimer = null;
        let _skeletonShownAt = 0;
        const SKELETON_MIN_MS = 380;
        function showMessagesSkeleton(){
            const box = document.getElementById('messages');
            if(!box) return;
            if(box.querySelector('.msg-skeleton')) return;
            if(_skeletonTimer){ clearTimeout(_skeletonTimer); _skeletonTimer = null; }
            _skeletonShownAt = Date.now();
            box.innerHTML = ''
                + '<div class="msg-skeleton">'
                + '  <div class="sk-row right"><div class="sk-bubble sk-text" style="width:min(340px,58vw)"><div class="sk-line"></div><div class="sk-line"></div></div></div>'
                + '  <div class="sk-row"><div class="sk-bubble sk-text" style="width:min(440px,74vw)"><div class="sk-line"></div><div class="sk-line"></div><div class="sk-line"></div></div></div>'
                + '  <div class="sk-row"><div class="sk-bubble sk-media" style="height:150px"></div></div>'
                + '  <div class="sk-hint"><span class="sk-dots"><span></span><span></span><span></span></span> 正在载入对话</div>'
                + '</div>';
        }

        function hideMessagesSkeleton(){
            if(_skeletonTimer){ clearTimeout(_skeletonTimer); _skeletonTimer = null; }
            const box = document.getElementById('messages');
            if(!box) return;
            const sk = box.querySelector('.msg-skeleton');
            if(!sk) return;
            const elapsed = Date.now() - _skeletonShownAt;
            const wait = Math.max(0, SKELETON_MIN_MS - elapsed);
            if(wait <= 0){ sk.remove(); return; }
            if(_skeletonTimer){ clearTimeout(_skeletonTimer); }
            _skeletonTimer = setTimeout(function(){
                _skeletonTimer = null;
                const again = box.querySelector('.msg-skeleton');
                if(again) again.remove();
            }, wait);
        }

        // 骨架存在时，保证至少显示 SKELETON_MIN_MS 再渲染真实内容
        async function renderMessagesAfterSkeleton(messages){
            const box = document.getElementById('messages');
            const sk = box ? box.querySelector('.msg-skeleton') : null;
            if(!sk){
                renderMessages(messages);
                return;
            }
            const elapsed = Date.now() - _skeletonShownAt;
            const wait = Math.max(0, SKELETON_MIN_MS - elapsed);
            if(wait > 0){
                await new Promise(function(r){ setTimeout(r, wait); });
            }
            if(_skeletonTimer){ clearTimeout(_skeletonTimer); _skeletonTimer = null; }
            renderMessages(messages);
        }

        async function loadConversations(opts){
            const wantSkeleton = !(opts && opts.skeleton === false);
            if(wantSkeleton) showMessagesSkeleton();
            try {
                const data = await fetch('/api/conversations', {headers:{'X-User-ID':userId}}).then(r=>r.json());
                conversations = data.conversations || [];
                renderThreads();
                if(!currentConversation) {
                    const rememberedId = rememberedConversation();
                    const target = (rememberedId && conversations.find(item => item.id === rememberedId)) || conversations[0];
                    if(target) {
                        await openConversation(target.id);
                    } else {
                        await renderMessagesAfterSkeleton([]);
                    }
                } else if(wantSkeleton) {
                    hideMessagesSkeleton();
                }
            } finally {
                hideMessagesSkeleton();
            }
        }

        function renderThreads(){
            const list = document.getElementById('threadList');
            list.innerHTML = '';
            if(!conversations.length){
                list.innerHTML = `<div class="px-3 py-8 text-center text-[11px] font-bold text-gray-300 uppercase tracking-widest">${tr('chat.noHistory')}</div>`;
                return;
            }
            conversations.forEach(item => {
                const row = document.createElement('div');
                row.className = 'thread-row';
                const btn = document.createElement('button');
                btn.className = `thread-item ${currentConversation?.id === item.id ? 'active' : ''}`;
                btn.onclick = () => openConversation(item.id, true);
                btn.innerHTML = `<div class="text-sm font-bold truncate">${escapeHtml(item.title || defaultTitle())}</div><div class="text-[11px] opacity-50 truncate mt-1">${escapeHtml(item.last_message || '')}</div>`;
                const del = document.createElement('button');
                del.className = 'thread-delete';
                del.title = tr('chat.deleteTitle');
                del.onclick = (event) => deleteConversation(item.id, event);
                del.innerHTML = '<i data-lucide="x" class="w-3.5 h-3.5"></i>';
                row.appendChild(btn);
                row.appendChild(del);
                list.appendChild(row);
            });
            lucide.createIcons();

        async function newConversation(){
            const data = await fetch('/api/conversations', {method:'POST', headers:headers(), body:JSON.stringify({title:'新对话'})}).then(r=>r.json());
            currentConversation = data.conversation;
            rememberConversation(currentConversation.id);
            setChatTitle(currentConversation.title);
            await loadConversations({skeleton:false});
            renderMessages([]);
            toggleHistory(false);

        async function openConversation(id, closePanel=false){
            showMessagesSkeleton();
            const res = await fetch(`/api/conversations/${id}`, {headers:{'X-User-ID':userId}});
            if(!res.ok){
                currentConversation = null;
                rememberConversation('');
                await renderMessagesAfterSkeleton([]);
                return;
            }
            const data = await res.json();
            currentConversation = data.conversation;
            rememberConversation(currentConversation.id);
            setChatTitle(currentConversation.title);
            renderThreads();
            await renderMessagesAfterSkeleton(currentConversation.messages || []);
            if(closePanel) toggleHistory(false);
        }

        async function deleteConversation(id, event){
            event.stopPropagation();
            if(!confirm(tr('chat.deleteConfirm'))) return;
            await fetch(`/api/conversations/${id}`, {method:'DELETE', headers:{'X-User-ID':userId}});
            const deletedCurrent = currentConversation?.id === id;
            if(deletedCurrent){ currentConversation = null; rememberConversation(''); setChatTitle(''); renderMessages([]); }
            await loadConversations({skeleton:false});
            if(deletedCurrent && conversations[0]) await openConversation(conversations[0].id);
        }

        function normalizeChatCustomSize(value){
            const match = String(value || '').trim().match(/^([1-9]\d{2,3})\s*[xX×*]\s*([1-9]\d{2,3})$/);
            if(!match) return '';
            const w = Math.round(Number(match[1]));
            const h = Math.round(Number(match[2]));
            if(w < 256 || h < 256 || w > 8192 || h > 8192) return '';
            return `${w}x${h}`;
        }

        function chatSizeForResolution(label = chatResolution){

            const match = options.find(([, item]) => item === label) || options[0];
            return match[0];
        }

        function chatResolutionForRequest(message, requestedSize){
            if(['1k','2k','4k'].includes(chatResolution)) return chatResolution;
            const text = String(message || '');
            if(/4\s*k|4K|超清|超高分辨率/i.test(text)) return '4k';
            if(/2\s*k|2K|高清|高分辨率/i.test(text)) return '2k';
            const edge = Math.max(...String(requestedSize || '').split(/[xX×*]/).map(n => Number(n) || 0));
            if(edge >= 2800) return '4k';
            if(edge >= 1600) return '2k';
            return '1k';
        }

        function chatSizeFromPrompt(message, fallbackSize = currentChatSize()){
            const text = String(message || '');
            const direct = text.match(/(^|[^\d])([1-9]\d{2,4})\s*[xX×*]\s*([1-9]\d{2,4})(?!\d)/);
            if(direct) {
                const w = Number(direct[2]);
                const h = Number(direct[3]);
                if(w >= 256 && h >= 256) return `${w}x${h}`;
            }
            const normalized = text.replace(/[：﹕∶]/g, ':').replace(/比/g, ':').replace(/[／/]/g, ':');
            const match = normalized.match(/(^|[^\d])(1|2|3|4|9|16)\s*:\s*(1|2|3|4|9|16)(?!\d)/);
            if(!match) return fallbackSize;
            const ratio = `${Number(match[2])}:${Number(match[3])}`;
            const ratioMap = { '1:1':'square', '2:3':'portrait', '3:2':'landscape', '3:4':'portrait43', '4:3':'landscape43', '9:16':'story', '16:9':'wide' };
            const key = ratioMap[ratio];
            if(!key) return fallbackSize;
            const wants4k = /4\s*k|4K|超清|超高分辨率/i.test(text);
            const wants2k = /2\s*k|2K|高清|高分辨率/i.test(text);
            if(chatResolution === 'custom' && !wants4k && !wants2k) return fallbackSize;
            const fallbackEdge = Math.max(...String(fallbackSize || '').split(/[xX×*]/).map(n => Number(n) || 0));
            const targetLabel = wants4k ? '4k' : (wants2k ? '2k' : (chatResolution === 'auto' ? '1k' : (fallbackEdge >= 2400 ? '4k' : (fallbackEdge >= 1500 ? '2k' : '1k'))));
            return (SIZE_OPTIONS[key] || SIZE_OPTIONS.square).find(([, label]) => label === targetLabel)?.[0] || fallbackSize;
        }

        /* 上下文窗口常量：置于所有调用点之前，避免 const 暂时性死区 */
        function buildReasoningBox(text, isStreaming){
            const box = document.createElement('div');
            box.className = 'reasoning-box' + (isStreaming ? ' streaming open' : '');
            const head = document.createElement('div');
            head.className = 'reasoning-head';

            dot.className = 'r-dot';

            label.className = 'r-label';
            label.textContent = isStreaming ? '正在深度思考…' : ('💭 思考过程 · ' + text.length + ' 字');

            arrow.className = 'r-arrow';

            head.appendChild(dot);
            head.appendChild(label);
            head.appendChild(arrow);
            const body = document.createElement('div');
            body.className = 'reasoning-body';
            body.textContent = text;
            head.addEventListener('click', () => { box.classList.toggle('open'); });
            box.appendChild(head);
            box.appendChild(body);
            return box;
        }

        function applyReasoningText(box, text, stillStreaming){
            const body = box.querySelector('.reasoning-body');
            const label = box.querySelector('.r-label');
            if(body){
                body.textContent = text;
                if(stillStreaming){
                    body.scrollTop = body.scrollHeight;
                }
            }
            if(label){
                label.textContent = stillStreaming
                    ? ('正在深度思考… (' + text.length + ' 字)')
                    : ('💭 思考过程 · ' + text.length + ' 字');
            }
            if(!stillStreaming){
                box.classList.remove('streaming');
                box.classList.remove('open');
            }
        }

        function updateReasoningBox(box, text, stillStreaming){
            if(!box) return;
            if(stillStreaming){
                box._pendingReasoning = text;
                if(!box._reasonThrottle){
                    box._reasonThrottle = setTimeout(function(){
                        box._reasonThrottle = null;
                        applyReasoningText(box, box._pendingReasoning || '', true);
                    }, 120);
                }
            } else {
                if(box._reasonThrottle){
                    clearTimeout(box._reasonThrottle);
                    box._reasonThrottle = null;
                }
                applyReasoningText(box, text, false);
            }
        }

        // 失效远程图拦截：预签名 R2 / 已过期图床，直接不发起请求，避免 10 秒连接超时卡顿
        const EXPIRED_IMG_PATTERNS = [
            /sub2api\.[a-z0-9]+\.r2\.cloudflarestorage\.com/i,
            /X-Amz-Expires=/i
        ];
        // 缩略图 URL 生成：本地图走 /api/thumb 后端压缩，避免前端加载数千万像素原图
        function thumbUrl(url, w){
            const u = String(url || '');
            if(!u) return u;
            if(u.startsWith('/assets/') || u.startsWith('/output/')){
                return '/api/thumb?path=' + encodeURIComponent(u) + '&w=' + (w || 400);
            }
            return u;
        }

        function isLikelyExpiredImage(url){
            const u = String(url || '');
            if(!u) return true;
            return EXPIRED_IMG_PATTERNS.some(function(p){ return p.test(u); });
        }
        function makeExpiredPlaceholder(){
            const d = document.createElement('div');
            d.className = 'img-expired';
            d.textContent = '🖼️ 图片链接已过期或不可达';

        function addMessageBubble(msg){
            const box = document.getElementById('messages');
            const row = document.createElement('div');
            row.className = `bubble-row ${msg.role === 'user' ? 'user' : 'assistant'}`;
            const bubble = document.createElement('div');
            bubble.className = `bubble ${msg.role === 'user' ? 'user' : 'assistant'}`;
            const imageUrls = Array.isArray(msg.image_urls) && msg.image_urls.length ? msg.image_urls : (msg.image_url ? [msg.image_url] : []);
            if(imageUrls.length) bubble.classList.add('image-bubble');
            if(msg.web_search_label){
                const pill = document.createElement('div');
                pill.className = 'omni-web-pill';
                pill.textContent = `🌐 ${msg.web_search_label}`;
                bubble.appendChild(pill);
            }
            if(msg.image_search){
                const rec = msg.image_search || {};
                const ipill = document.createElement('div');
                ipill.className = 'omni-web-pill omni-img-pill';
                if(rec.found){
                    if(rec.source === 'visual_fallback'){
                        const kws = (rec.keywords || []).slice(0,3).join(' · ');
                        const cnt = rec.count ? (' · 已检索 ' + rec.count + ' 条') : '';
                        ipill.textContent = '🔍 视觉描述检索命中：' + (kws || '相关结果') + cnt;
                    } else {
                        const best = rec.best || {};
                        const parts = [];
                        if(best.characters) parts.push(best.characters);
                        if(best.title) parts.push(best.title);
                        if(best.author) parts.push('作者 ' + best.author);
                        const head = parts.length ? parts.join(' · ') : '已匹配';
                        const sim = best.similarity ? (' · ' + best.similarity + '%') : '';
                        const cnt = rec.count && rec.count > 1 ? (' · ' + rec.count + ' 个候选') : '';
                        ipill.textContent = '🔍 图搜命中：' + head + sim + cnt;
                    }
                } else {
                    ipill.textContent = '🔍 未找到可信匹配' + (rec.error ? ('：' + rec.error) : '');
                }
                bubble.appendChild(ipill);
            }
            if(msg.reasoning){
                bubble.appendChild(buildReasoningBox(msg.reasoning, false));
            }
            const text = document.createElement('div');
            text.textContent = msg.type === 'image' ? (msg.agent_reply || tr('chat.generated')) : (msg.content || '');
            text.className = 'bubble-text';
            bubble.appendChild(text);
            if(msg.attachments?.length){
                const thumbs = document.createElement('div');
                thumbs.className = 'thumbs';

            const kind = String(ref?.kind || '').toLowerCase();

            const url = String(ref?.url || '').toLowerCase();
            return kind === 'image' || mime.startsWith('image/') || /\.(png|jpe?g|webp|gif|bmp|tiff?)(\?|#|$)/.test(url);
        }

        function localContextUsage(messages){
            const msgs = Array.isArray(messages) ? messages : [];
            let chars = 0, imgs = 0;
            msgs.forEach(m => {
                if(!m || typeof m !== 'object') return;
                chars += String(m.content || '').length;
                (m.attachments || []).forEach(a => {
                    if(!a || typeof a !== 'object') return;
                    const kind = String(a.kind || '').toLowerCase();
                    const mime = String(a.mime || '').toLowerCase();
                    if(kind === 'image' || mime.indexOf('image/') === 0) imgs++;
                });
                if(m.type === 'image') imgs++;
            });
            const n = msgs.length;
            return {
                messages: n,
                window_limit: CTX_WINDOW_LIMIT,
                warn_at: CTX_WARN_AT,
                est_tokens: Math.round(chars / 1.5) + imgs * 800,
                images: imgs,
                text_chars: chars,
                percent: CTX_WINDOW_LIMIT ? Math.round(n * 1000 / CTX_WINDOW_LIMIT) / 10 : 0,
                need_warning: n >= CTX_WARN_AT,
            };
        }

        function maybeWarnNewTopic(usage){

            row.className = 'ctx-warn-row';

                + ' 条）。继续聊下去会拖慢响应并推高成本，建议在左侧新建一个话题继续～';

        function updateContextMeter(usage){
            const box = document.getElementById('ctxMeter');
            const fill = document.getElementById('ctxRingFill');
            const txt = document.getElementById('ctxMeterText');
            if(!box || !fill || !txt) return;
            if(!usage){
                box.classList.remove('warn', 'danger');
                txt.textContent = '0/' + CTX_WINDOW_LIMIT;
                fill.style.strokeDashoffset = String(CTX_RING_LEN);
                box.title = '上下文用量';
                return;
            }
            const pct = Math.max(0, Math.min(100, Number(usage.percent) || 0));
            fill.style.strokeDashoffset = String(CTX_RING_LEN * (1 - pct / 100));
            txt.textContent = usage.messages + '/' + (usage.window_limit || CTX_WINDOW_LIMIT);
            box.classList.toggle('warn', pct >= 75 && pct < 93);
            box.classList.toggle('danger', pct >= 93);
            const lines = [];
            lines.push('消息 ' + usage.messages + ' / ' + (usage.window_limit || CTX_WINDOW_LIMIT) + ' 条（' + pct + '%）');
            lines.push('估算 ≈ ' + Number(usage.est_tokens || 0).toLocaleString() + ' tokens');
            lines.push('图片 ' + (usage.images || 0) + ' 张 · 文本 ' + Number(usage.text_chars || 0).toLocaleString() + ' 字符');
            if(usage.need_warning) lines.push('⚠️ 已达提醒阈值，建议开启新对话');

        async function regenerateReply(){

            while(msgs.length && msgs[msgs.length - 1].role === 'assistant') msgs.pop();

        async function sendMessage(){

            if(!message && !refs.length) return;

            scrollBottom();
            try {

                const requestAspectRatio = currentChatAspectRatio();
                if(useStreaming) {
                    await streamChatMessage(message, pendingRefs, assistantBubble, requestedSize, requestAspectRatio, requestResolution);

                            image_model: activeImageModel || config.image_model,

                    }).then(async r => { if(!r.ok) throw new Error((await r.json()).detail || tr('chat.requestFailed')); return r.json(); });
                    currentConversation = data.conversation;
                    rememberConversation(currentConversation.id);
                    setChatTitle(currentConversation.title);
                    renderMessages(currentConversation.messages || []);
                    await loadConversations({skeleton:false});
                } else {

        function refreshMsgLocator(){
            const bar = document.getElementById('msgLocator');
            const box = document.getElementById('messages');
            if(!bar || !box) return;
            const rows = [...box.querySelectorAll('.bubble-row')];
            if(rows.length < 3){
                setLocatorVisible(bar, false);
                bar.innerHTML = '';
                return;
            }
            setLocatorVisible(bar, true);
            const keep = Math.max(6, Math.min(rows.length, 26));
            const step = Math.max(1, Math.ceil(rows.length / keep));
            const count = Math.ceil(rows.length / step);
            const barH = bar.clientHeight || 400;
            const needH = count * 6 + Math.max(0, count - 1) * 9;
            let gap = 9;
            if(needH > barH && count > 1){
                gap = Math.max(2, Math.floor((barH - count * 6) / (count - 1)));
            }
            bar.style.gap = gap + 'px';
            bar.innerHTML = '';
            let preview = document.getElementById('locPreview');
            if(!preview){
                preview = document.createElement('div');
                preview.className = 'loc-preview';
                preview.id = 'locPreview';
            }
            if(preview.parentElement !== document.body) document.body.appendChild(preview);
            const frag = document.createDocumentFragment();
            for(let i = 0; i < rows.length; i += step){
                const tick = document.createElement('div');
                tick.className = 'loc-tick';
                tick.dataset.idx = String(i);
                tick.addEventListener('click', function(){
                    const all = [...box.querySelectorAll('.bubble-row')];
                    const target = all[Number(this.dataset.idx)];
                    if(!target) return;
                    const boxRect = box.getBoundingClientRect();
                    const rowRect = target.getBoundingClientRect();
                    const delta = rowRect.top - boxRect.top;
                    const goal = Math.max(0, box.scrollTop + delta - (box.clientHeight - rowRect.height) / 2);
                    const prevBehavior = box.style.scrollBehavior;
                    box.style.scrollBehavior = 'auto';
                    box.scrollTop = goal;
                    setTimeout(function(){ box.style.scrollBehavior = prevBehavior; updateLocatorActive(); }, 60);
                });
                tick.addEventListener('mouseenter', function(){
                    showLocatorPreview(Number(this.dataset.idx));
                });
                tick.addEventListener('mouseleave', function(){
                    hideLocatorPreview();
                });
                frag.appendChild(tick);
            }
            bar.appendChild(frag);
            updateLocatorActive();
        }

        function showLocatorPreview(idx){
            const bar = document.getElementById('msgLocator');
            const box = document.getElementById('messages');
            const preview = document.getElementById('locPreview');
            if(!bar || !box || !preview) return;
            const rows = [...box.querySelectorAll('.bubble-row')];
            const row = rows[idx];
            if(!row) return;
            const isUser = row.classList.contains('user');
            const bubble = row.querySelector('.bubble');
            let txt = '';
            if(bubble){
                const clone = bubble.cloneNode(true);
                clone.querySelectorAll('.reasoning-box, .streaming-indicator, .generated-grid, img, .thumbs, .regen-row, .stopped-tag, .omni-web-pill').forEach(function(n){ n.remove(); });
                const bt = clone.querySelector('.bubble-text') || clone;
                txt = String(bt.textContent || '').replace(/\s+/g, ' ').trim();
            }
            preview.innerHTML = '';
            const head = document.createElement('div');
            head.className = 'lp-head';
            const role = document.createElement('span');
            role.className = 'lp-role ' + (isUser ? 'is-user' : 'is-ai');
            role.textContent = isUser ? '你' : 'AI';
            head.appendChild(role);
            const idxEl = document.createElement('span');
            idxEl.className = 'lp-idx';
            idxEl.textContent = '#' + (idx + 1) + ' / ' + rows.length;
            head.appendChild(idxEl);
            preview.appendChild(head);
            if(txt){
                const t = document.createElement('div');
                t.className = 'lp-text';
                t.textContent = txt.length > 96 ? txt.slice(0, 96) + '…' : txt;
                preview.appendChild(t);
            }
            const srcs = [];
            row.querySelectorAll('img').forEach(function(im){
                if(im.src && srcs.length < 3 && srcs.indexOf(im.src) < 0) srcs.push(im.src);
            });
            if(srcs.length){
                const tw = document.createElement('div');
                tw.className = 'lp-thumbs';
                srcs.forEach(function(s){
                    const im = document.createElement('img');
                    im.className = 'lp-thumb';
                    im.src = s;
                    tw.appendChild(im);
                });
                preview.appendChild(tw);
            }
            const tick = bar.querySelector('.loc-tick[data-idx="' + idx + '"]');
            if(!tick) return;
            const tickRect = tick.getBoundingClientRect();
            const winW = window.innerWidth;
            const winH = window.innerHeight;
            const ph = preview.offsetHeight || 80;
            const pw = preview.offsetWidth || 160;
            const halfH = ph / 2;
            let top = tickRect.top + tickRect.height / 2 - halfH;
            top = Math.max(8, Math.min(top, winH - ph - 8));
            let left = tickRect.left - pw - 14;
            if(left < 8) left = tickRect.right + 14;
            if(left + pw > winW - 8) left = Math.max(8, winW - pw - 8);
            preview.style.top = top + 'px';
            preview.style.left = left + 'px';
            preview.style.right = 'auto';
            preview.classList.remove('show');
            void preview.offsetWidth;
            preview.classList.add('show');
        }

        function updateLocatorActive(){

            const ticks = [...bar.querySelectorAll('.loc-tick')];
            if(!ticks.length) return;
            const rows = [...box.querySelectorAll('.bubble-row')];
            if(!rows.length) return;
            const boxRect = box.getBoundingClientRect();
            const midY = boxRect.top + boxRect.height / 2;
            let best = 0, bestDist = Infinity;
            rows.forEach(function(r, i){
                const rc = r.getBoundingClientRect();
                if(!rc.height) return;
                const d = Math.abs((rc.top + rc.bottom) / 2 - midY);
                if(d < bestDist){ bestDist = d; best = i; }
            });
            const span = Math.max(1, Math.ceil(rows.length / Math.max(1, ticks.length)));
            ticks.forEach(function(t){
                const idx = Number(t.dataset.idx);
                t.classList.toggle('active', Math.abs(idx - best) < span);
            });
        }

        function scheduleLocatorRefresh(){
            if(_locatorRebuildTimer) return;
            _locatorRebuildTimer = setTimeout(function(){
                _locatorRebuildTimer = null;
                refreshMsgLocator();
            }, 180);
        }

        function bindLocatorScroll(){
            const box = document.getElementById('messages');
            if(!box) return;
            if(box.dataset.locatorBound !== '1'){
                box.dataset.locatorBound = '1';
                box.addEventListener('scroll', function(){
                    if(_locatorScrollRaf) return;
                    _locatorScrollRaf = requestAnimationFrame(function(){
                        _locatorScrollRaf = null;
                        updateLocatorActive();
                    });
                }, { passive:true });
            }
            if(!window._locatorObserver && window.MutationObserver){
                window._locatorObserver = new MutationObserver(function(muts){
                    for(let i=0;i<muts.length;i++){
                        const m = muts[i];
                        if(m.type === 'childList' && m.target && m.target.id === 'messages' && m.addedNodes && m.addedNodes.length){
                            scheduleLocatorRefresh();
                            return;
                        }
                    }
                });
                window._locatorObserver.observe(box, { childList:true });
            }
        }

        // 性能模式自动降级（必须置于所有调用点之前）
        const PERF_LITE_THRESHOLD = 8;
        let _perfStreaming = false;
        function applyPerfMode(msgCount){
            const n = typeof msgCount === 'number' ? msgCount : ((currentConversation && currentConversation.messages) ? currentConversation.messages.length : 0);
            const lite = _perfStreaming || n >= PERF_LITE_THRESHOLD;
            document.body.classList.toggle('perf-lite', lite);
        }

        async function streamChatMessage(message, pendingRefs, assistantBubble, requestedSize='', requestAspectRatio='', requestResolution=''){
            const currentProvider = provider;
            const currentMsModel = provider === 'modelscope' ? (msModel || activeChatModel || (config.ms_chat_models?.[0] || '')) : '';
            const currentChatModel = activeChatModel || config.chat_model;
            let loaderTimer = null;
            let reasoningText = '';
            let reasoningSealed = false;
            let loaderEl = null;

            _activeAbort = new AbortController();
            const res = await fetch('/api/chat/stream', {
                method:'POST',
                signal: _activeAbort.signal,
                headers:headers(),
                body:JSON.stringify({
                    conversation_id: currentConversation.id || '',
                    message,
                    system_prompt: currentSystemPrompt(),
                    mode: mode === 'agent' ? 'agent' : 'chat',
                    size: requestedSize || currentChatSize(),
                    aspect_ratio: requestAspectRatio || currentChatAspectRatio(),
                    resolution: requestResolution || chatResolutionForRequest(message, requestedSize),
                    model: currentProvider === 'modelscope' ? currentMsModel : currentChatModel,
                    ms_model: currentProvider === 'modelscope' ? currentMsModel : '',
                    image_model: activeImageModel || config.image_model,
                    provider: currentProvider,
                    image_provider: activeImageProvider,
                    web_search: window.enableOmniWebSearch !== false,
                    reference_images: pendingRefs
                })
            });
            if(!res.ok) throw new Error((await res.json()).detail || tr('chat.requestFailed'));
            _perfStreaming = true;
            applyPerfMode();
            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            let fullText = '';
            try {
                while(true){
                    const {value, done} = await reader.read();
                    if(done) break;
                    buffer += decoder.decode(value, {stream:true});
                    const events = buffer.split('\n\n');
                    buffer = events.pop() || '';
                    for(const eventText of events){
                        const line = eventText.split('\n').find(item => item.startsWith('data:'));
                        if(!line) continue;
                        const event = JSON.parse(line.slice(5).trim());
                        if(event.type === 'meta'){
                            currentConversation = event.conversation;
                            rememberConversation(currentConversation.id);
                            setChatTitle(currentConversation.title);
                            if(event.context_usage) updateContextMeter(event.context_usage);
                        }
                        if(event.type === 'web_searching'){
                            let pill = assistantBubble.bubble.querySelector('.omni-web-pill');
                            if(!pill){
                                pill = document.createElement('div');
                                pill.className = 'omni-web-pill';
                                assistantBubble.bubble.insertBefore(pill, assistantBubble.text);
                            }
                            const qLabel = (event.urls && event.urls.length) ? `正在读取网页链接 (${event.urls[0].slice(0, 36)}...)` : `正在联网检索：${event.query || ''}`;
                            pill.textContent = `🌐 ${qLabel}`;
                            scrollBottom();
                        }
                        if(event.type === 'web_search_refining'){
                            let pill = assistantBubble.bubble.querySelector('.omni-web-pill');
                            if(!pill){
                                pill = document.createElement('div');
                                pill.className = 'omni-web-pill';
                                assistantBubble.bubble.insertBefore(pill, assistantBubble.text);
                            }
                            pill.classList.add('is-loading');
                            const qs = (event.queries || []).slice(0, 2).join(' | ');
                            pill.textContent = '🔄 ' + (event.label || ('补充检索：' + qs));
                            scrollBottom();
                        }
                        if(event.type === 'web_search_done'){
                            let pill = assistantBubble.bubble.querySelector('.omni-web-pill');
                            if(!pill){
                                pill = document.createElement('div');
                                pill.className = 'omni-web-pill';
                                assistantBubble.bubble.insertBefore(pill, assistantBubble.text);
                            }
                        if(event.type === 'image_searching'){
                            let pill = assistantBubble.bubble.querySelector('.omni-img-pill');
                            if(!pill){
                                pill = document.createElement('div');
                                pill.className = 'omni-web-pill omni-img-pill';
                                assistantBubble.bubble.insertBefore(pill, assistantBubble.text);
                            }
                            pill.classList.add('is-loading');
                            const imgName = event.name ? ('（' + String(event.name).slice(0, 28) + '）') : '';
                            const engine = event.engine || 'SauceNAO';
                            pill.textContent = '🔍 正在以图搜图' + imgName + ' · ' + engine;
                            scrollBottom();
                        }
                        if(event.type === 'image_describing'){
                            let pill = assistantBubble.bubble.querySelector('.omni-img-pill');
                            if(!pill){
                                pill = document.createElement('div');
                                pill.className = 'omni-web-pill omni-img-pill';
                                assistantBubble.bubble.insertBefore(pill, assistantBubble.text);
                            }
                            pill.classList.add('is-loading');
                            pill.textContent = '🔍 ' + (event.label || '图搜未命中，正在分析画面特征…');
                            scrollBottom();
                        }
                        if(event.type === 'image_fallback_searching'){
                            let pill = assistantBubble.bubble.querySelector('.omni-img-pill');
                            if(!pill){
                                pill = document.createElement('div');
                                pill.className = 'omni-web-pill omni-img-pill';
                                assistantBubble.bubble.insertBefore(pill, assistantBubble.text);
                            }
                            pill.classList.add('is-loading');
                            pill.textContent = '🔍 ' + (event.label || (event.keywords ? ('视觉描述检索：' + (event.keywords || []).slice(0,2).join(' | ')) : '正在按视觉特征检索…'));
                            scrollBottom();
                        }
                        if(event.type === 'image_search_done'){
                            let pill = assistantBubble.bubble.querySelector('.omni-img-pill');
                            if(!pill){
                                pill = document.createElement('div');
                                pill.className = 'omni-web-pill omni-img-pill';
                                assistantBubble.bubble.insertBefore(pill, assistantBubble.text);
                            }
                            pill.classList.remove('is-loading');
                            const best = event.best || {};
                            const viaVisual = event.source === 'visual_fallback';
                            if(event.found){
                                if(viaVisual){
                                    const kws = (event.keywords || []).slice(0,3).join(' · ');
                                    const cnt = event.count ? (' · 已检索 ' + event.count + ' 条') : '';
                                    pill.textContent = '🔍 视觉描述检索命中：' + (kws || '相关结果') + cnt;
                                } else {
                                    const parts = [];
                                    if(best.characters) parts.push(best.characters);
                                    if(best.title) parts.push(best.title);
                                    if(best.author) parts.push('作者 ' + best.author);
                                    const head = parts.length ? parts.join(' · ') : '已匹配';
                                    const sim = best.similarity ? (' · ' + best.similarity + '%') : '';
                                    const cnt = event.count && event.count > 1 ? (' · ' + event.count + ' 个候选') : '';
                                    pill.textContent = '🔍 图搜命中：' + head + sim + cnt;
                                }
                            } else {
                                const reason = event.error ? ('：' + event.error) : '';
                                pill.textContent = '🔍 未找到可信匹配' + reason;
                            }
                            scrollBottom();
                        }
                            pill.classList.remove('is-loading');
                            const doneLabel = event.label || ((event.urls && event.urls.length) ? `已读取网页实时内容` : `已参考联网检索 (${event.query || '实时资料'})`);
                            pill.textContent = `🌐 ${doneLabel}`;
                            scrollBottom();
                        }
                        if(event.type === 'thinking'){
                            if(!assistantBubble.reasoningBox){
                                assistantBubble.reasoningBox = buildReasoningBox('', true);
                                assistantBubble.bubble.insertBefore(assistantBubble.reasoningBox, assistantBubble.text);
                            }
                            reasoningText += event.delta || '';
                            updateReasoningBox(assistantBubble.reasoningBox, reasoningText, true);
                            scrollBottom();
                        }
                        if(event.type === 'delta'){
                            if(assistantBubble.bubble.classList.contains('is-empty')){
                                assistantBubble.bubble.classList.remove('is-empty');
                            }
                            if(assistantBubble.reasoningBox && !reasoningSealed){
                                updateReasoningBox(assistantBubble.reasoningBox, reasoningText, false);
                                reasoningSealed = true;
                            }
                            fullText += event.delta || '';
                            if(!assistantBubble._flushTimer){
                                assistantBubble._flushTimer = setTimeout(function(){
                                    assistantBubble._flushTimer = null;
                                    assistantBubble.text.textContent = fullText;
                                    scrollBottom();
                                }, 60);
                            }
                        }
                        if(event.type === 'image_generating'){
                            assistantBubble.bubble.classList.remove('streaming');
                            assistantBubble.bubble.classList.add('image-bubble');
                            if(!loaderEl){
                                loaderEl = document.createElement('div');
                                loaderEl.className = 'omni-img-loader';
                                const startSec = Date.now();
                                const refTag = event.ref_label || '正在绘制';
                                const mdlTag = shortModelName(event.model || activeImageModel);
                                loaderEl.innerHTML = `<div class="omni-spinner"></div><div class="omni-loader-info"><div class="omni-loader-title"><span>🎨 ${escapeHtml(refTag)} · ${escapeHtml(mdlTag)}</span><span class="omni-timer">0s</span></div><div class="omni-loader-sub">${escapeHtml(event.prompt || '')}</div></div>`;
                                assistantBubble.bubble.appendChild(loaderEl);
                                const timerSpan = loaderEl.querySelector('.omni-timer');
                                loaderTimer = setInterval(() => {
                                    if(timerSpan) timerSpan.textContent = `${Math.floor((Date.now() - startSec)/1000)}s`;
                                }, 1000);
                            }
                            scrollBottom();
                        }
                        if(event.type === 'error') throw new Error(event.detail || tr('chat.requestFailed'));
                        if(event.type === 'done'){
                            if(loaderTimer) { clearInterval(loaderTimer); loaderTimer = null; }
                            assistantBubble.bubble.classList.remove('streaming');
                            if(assistantBubble._flushTimer){
                                clearTimeout(assistantBubble._flushTimer);
                                assistantBubble._flushTimer = null;
                            }
                            currentConversation = event.conversation;
                            rememberConversation(currentConversation.id);
                            setChatTitle(currentConversation.title);
                            const lastMsg = event.message;
                            if(lastMsg && lastMsg.id){
                                if(!currentConversation.messages.some(function(m){ return m.id === lastMsg.id; })){
                                    currentConversation.messages.push(lastMsg);
                                }
                                if(lastMsg.type === 'image'){
                                    if(!assistantBubble.text.textContent) assistantBubble.text.textContent = lastMsg.agent_reply || '';
                                    if(!assistantBubble.bubble.querySelector('.generated-grid')){
                                        const grid = document.createElement('div');
                                        const urls = Array.isArray(lastMsg.image_urls) && lastMsg.image_urls.length
                                            ? lastMsg.image_urls : (lastMsg.image_url ? [lastMsg.image_url] : []);
                                        grid.className = 'generated-grid count-' + Math.min(urls.length, 4);
                                        urls.forEach(function(u){
                                            const wrap = document.createElement('div');
                                            wrap.className = 'gen-card-wrap';
                                            const im = document.createElement('img');
                                            im.className = 'generated';
                                            im.decoding = 'async';
                                            im.src = thumbUrl(u, 480);
                                            im.onclick = function(){ openImagePreview(u); };
                                            wrap.appendChild(im);
                                            grid.appendChild(wrap);
                                        });
                                        assistantBubble.bubble.appendChild(grid);
                                        assistantBubble.bubble.classList.add('image-bubble');
                                    }
                                } else if(lastMsg.content) {
                                    assistantBubble.text.textContent = lastMsg.content;
                                }
                            } else if(!assistantBubble.text.textContent) {
                                assistantBubble.text.textContent = '';
                            }
                            updateContextMeter(localContextUsage(currentConversation.messages));
                            scrollBottom();
                        }
                    }
                }
            } finally {
                if(loaderTimer) clearInterval(loaderTimer);
                assistantBubble.bubble.classList.remove('streaming', 'is-empty');
                const _ind = assistantBubble.bubble.querySelector('.streaming-indicator');
                if(_ind) _ind.remove();
                const _staleDots = assistantBubble.text.querySelector('.typing-dots');
                if(_staleDots) _staleDots.remove();
                _perfStreaming = false;
                applyPerfMode();
                _activeAbort = null;
            }
        }

        let _sbPending = false;
        function scrollBottom(){
            if(_sbPending) return;
            _sbPending = true;
            requestAnimationFrame(() => {
                _sbPending = false;
                const box = document.getElementById('messages');
                if(!box) return;
                const gap = box.scrollHeight - box.scrollTop - box.clientHeight;
                if(gap >= 160) return;
                const prev = box.style.scrollBehavior;
                box.style.scrollBehavior = 'auto';
                box.scrollTop = box.scrollHeight;
                box.style.scrollBehavior = prev;
            });
        }
        function escapeHtml(str){ return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s])); }

        window.onload = async () => {
            applyLanguage();
            syncSystemPromptUI();
            setChatRatio(chatRatio);
            setChatResolution(chatResolution);
            await loadConfig();
            await loadConversations();
            updateComposerOverflow();
        };
    </script>
</body>
